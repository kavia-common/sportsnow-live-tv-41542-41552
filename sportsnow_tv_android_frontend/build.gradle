buildscript {
    // No additional classpaths required; using plugins DSL below
}

plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'com.android.library' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // Add Google services only if google-services plugin is needed by app
    // id 'com.google.gms.google-services' version '4.4.2' apply false
}

ext {
    versions = [
        compileSdk : 34,
        minSdk     : 30,
        targetSdk  : 34,
        kotlin     : '1.9.24',
        media3     : '1.4.1',
        firebaseBom: '33.4.0'
    ]
}
